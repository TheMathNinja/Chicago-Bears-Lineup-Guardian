name: Chicago Bears Lineup Guardian
run-name: ${{ inputs.dispatch_id != '' && format('Chicago Bears Lineup Guardian - {0}', inputs.dispatch_id) || 'Chicago Bears Lineup Guardian' }}

on:
  workflow_dispatch:
    inputs:
      live:
        description: Allow verified MFL lineup writes
        type: boolean
        default: false
      noop:
        description: Resubmit and verify the existing lineup unchanged
        type: boolean
        default: false
      dispatch_id:
        description: Optional idempotency identifier supplied by the precision scheduler
        type: string
        default: ''
  schedule:
    # Native Actions timing is a ten-minute, all-days fallback for the five-minute
    # Apps Script scheduler. Unusual Wednesday games must be protected too.
    - cron: "*/10 * * * *"

concurrency:
  group: lineup-guardian-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RUN_MODE: ${{ inputs.noop && 'noop' || 'monitor' }}
      LIVE_LINEUP_WRITES: ${{ github.event_name == 'workflow_dispatch' && inputs.live && 'true' || github.event_name == 'schedule' && vars.LIVE_LINEUP_WRITES || 'false' }}
    steps:
      # Always run the league-aware worker. It reads each roster's current week before
      # deciding whether a player is inside the 90-minute window, and is inexpensive
      # outside that window. A scheduler-level week guess can suppress a needed check.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: github.event_name != 'schedule'
        run: npm test
      - name: Check configuration
        id: configured
        shell: bash
        run: |
          if [[ -n "$MFL_USERNAME" && -n "$MFL_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Lineup Guardian is not credentialed yet; safely skipping the live-data worker."
          fi
      - if: steps.configured.outputs.ready == 'true'
        run: npm run check
      - name: Commit audit state
        if: steps.configured.outputs.ready == 'true'
        run: bash scripts/publish_audit_state.sh "Update lineup guardian audit"
