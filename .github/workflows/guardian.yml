name: Chicago Bears Lineup Guardian
run-name: ${{ inputs.dispatch_id != '' && format('Chicago Bears Lineup Guardian - {0}', inputs.dispatch_id) || 'Chicago Bears Lineup Guardian' }}

on:
  workflow_dispatch:
    inputs:
      live:
        description: Allow verified MFL lineup writes
        type: boolean
        default: false
      noop:
        description: Resubmit and verify the existing lineup unchanged
        type: boolean
        default: false
      dispatch_id:
        description: Optional idempotency identifier supplied by the precision scheduler
        type: string
        default: ''
  schedule:
    # Native Actions timing is a ten-minute fallback for the five-minute Apps Script scheduler.
    - cron: "*/10 * * * 4,5,6,0,1"

concurrency:
  group: lineup-guardian
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
      MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RUN_MODE: ${{ inputs.noop && 'noop' || 'monitor' }}
      LIVE_LINEUP_WRITES: ${{ inputs.live || vars.LIVE_LINEUP_WRITES || 'false' }}
    steps:
      - name: Suppress overlapping native backup run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff="$(date -u -d '8 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh run list --workflow guardian.yml --event workflow_dispatch --limit 20 \
            --json createdAt,status --jq "[.[] | select(.createdAt >= \"${cutoff}\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"completed\"))] | length")"
          if [ "${recent}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The five-minute Apps Script scheduler is healthy; native backup is not needed."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No recent Apps Script dispatch found; native backup will run."
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: steps.gate.outputs.run == 'true'
        run: npm test
      - name: Check configuration
        if: steps.gate.outputs.run == 'true'
        id: configured
        shell: bash
        run: |
          if [[ -n "$MFL_USERNAME" && -n "$MFL_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Lineup Guardian is not credentialed yet; safely skipping the live-data worker."
          fi
      - if: steps.gate.outputs.run == 'true' && steps.configured.outputs.ready == 'true'
        run: npm run check
      - name: Commit audit state
        if: steps.gate.outputs.run == 'true' && steps.configured.outputs.ready == 'true'
        run: bash scripts/publish_audit_state.sh "Update lineup guardian audit"
